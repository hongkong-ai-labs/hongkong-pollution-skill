name: Release

# Builds one tarball per target, checks it against Cargo.toml and CHANGELOG.md,
# then publishes a GitHub release with SHA256SUMS and install instructions.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify tag and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tag matches Cargo.toml and CHANGELOG.md
        id: meta
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          version=$(python3 - <<'PY'
          import pathlib, re, sys
          text = pathlib.Path("Cargo.toml").read_text(encoding="utf-8")
          package = text.split("[package]", 1)[1].split("\n[", 1)[0]
          match = re.search(r'^version\s*=\s*"([^"]+)"', package, re.MULTILINE)
          if not match:
              sys.exit("Cargo.toml has no package version")
          print(match.group(1))
          PY
          )
          if [ -z "$version" ]; then
            echo "could not read the version from Cargo.toml" >&2
            exit 1
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match Cargo.toml version $version (expected v$version)" >&2
            exit 1
          fi
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [$version]' section" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every target except x86_64-apple-darwin is built natively, so no
          # cross toolchain is involved: macos-latest is arm64, and Linux gets a
          # native x86_64 runner plus the arm64 runner. -latest labels are used
          # because macos-14 was retired on 2026-11-02 and terminated jobs.
          - target: aarch64-apple-darwin
            runs-on: macos-latest
          - target: x86_64-apple-darwin
            runs-on: macos-latest
          - target: x86_64-unknown-linux-musl
            runs-on: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runs-on: ubuntu-24.04-arm
    env:
      TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add "${{ matrix.target }}"

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools
          mangled="$(printf '%s' '${{ matrix.target }}' | tr '-' '_')"
          echo "CC_${mangled}=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_$(printf '%s' "$mangled" | tr '[:lower:]' '[:upper:]')_LINKER=musl-gcc" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.target }}
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Package
        run: |
          mkdir -p pkg
          cp "target/${{ matrix.target }}/release/hkpollution" pkg/hkpollution
          cp LICENSE pkg/LICENSE
          tar -czf "hkpollution-${TAG}-${{ matrix.target }}.tar.gz" -C pkg hkpollution LICENSE

      - name: Smoke test the packaged binary
        run: |
          case "$(uname -s):$(uname -m)" in
            Darwin:arm64) native=aarch64-apple-darwin ;;
            Darwin:x86_64) native=x86_64-apple-darwin ;;
            Linux:x86_64) native=x86_64-unknown-linux-musl ;;
            Linux:aarch64 | Linux:arm64) native=aarch64-unknown-linux-musl ;;
            *) native="" ;;
          esac
          if [ "$native" != "${{ matrix.target }}" ]; then
            echo "${{ matrix.target }} is not native to this runner; skipping the smoke test"
            exit 0
          fi
          mkdir -p smoke
          tar -xzf "hkpollution-${TAG}-${{ matrix.target }}.tar.gz" -C smoke
          ./smoke/hkpollution --version

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: hkpollution-*.tar.gz
          if-no-files-found: error

  release:
    name: publish release
    needs: [verify, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.verify.outputs.tag }}
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download tarballs
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        run: |
          cd dist
          shasum -a 256 ./*.tar.gz | awk '{ file = $2; sub(/^\.\//, "", file); print $1 "  " file }' | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Build release notes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          version = os.environ["VERSION"]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          start = next((i for i, line in enumerate(lines) if line.startswith(f"## [{version}]")), None)
          if start is None:
              raise SystemExit(f"CHANGELOG.md has no ## [{version}] section")
          section = [lines[start]]
          for line in lines[start + 1:]:
              if line.startswith("## ["):
                  break
              section.append(line)
          body = "\n".join(section).strip() + "\n"
          Path("section.md").write_text(body, encoding="utf-8")
          PY

          cat > markers.md <<'EOF'
          ## Install

          ```sh
          curl -fsSL https://raw.githubusercontent.com/hongkong-ai-labs/hongkong-pollution-skill/main/scripts/install.sh | sh
          ```

          Or add it as an agent skill:

          ```sh
          npx skills add hongkong-ai-labs/hongkong-pollution-skill
          ```
          EOF

          if [ -s section.md ]; then
            { cat section.md; printf '\n'; cat markers.md; } > notes.md
            echo "notes: changelog section for $VERSION plus install markers"
          else
            echo "notes: no changelog section for $VERSION, GitHub will generate them" >&2
          fi

      - name: Publish
        run: |
          if [ -s notes.md ]; then
            gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
              --title "$TAG" --notes-file notes.md --verify-tag
          else
            # No changelog section: let GitHub generate the notes from commits.
            gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
              --title "$TAG" --generate-notes --verify-tag
          fi

  docker:
    name: publish container image
    needs: [verify, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.verify.outputs.tag }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/hkpollution
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download linux tarballs
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Log in to the container registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push per architecture
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            case "$target" in
              x86_64*) arch=amd64 ;;
              *) arch=arm64 ;;
            esac
            mkdir -p "context-$arch"
            tar -xzf "dist/hkpollution-${TAG}-${target}.tar.gz" -C "context-$arch"
            cp Dockerfile "context-$arch/"
            docker buildx build --platform "linux/$arch" \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              -t "$IMAGE:$TAG-$arch" --push "context-$arch"
          done
          docker buildx imagetools create -t "$IMAGE:$TAG" "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"

  homebrew:
    name: update the homebrew tap
    needs: [verify, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.verify.outputs.tag }}
      VERSION: ${{ needs.verify.outputs.version }}
      BREW_TOKEN: ${{ secrets.BREW_TOKEN }}
    steps:
      - name: Download darwin tarballs
        if: env.BREW_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Note the missing tap token
        if: env.BREW_TOKEN == ''
        run: |
          echo "BREW_TOKEN is not set, so the formula was not pushed." >> "$GITHUB_STEP_SUMMARY"
          echo "Add a PAT with repo scope as BREW_TOKEN to publish to the tap." >> "$GITHUB_STEP_SUMMARY"

      - name: Generate the formula
        if: env.BREW_TOKEN != ''
        run: |
          set -euo pipefail
          base="${{ github.server_url }}/${{ github.repository }}/releases/download/${TAG}"
          arm_sha=$(shasum -a 256 "dist/hkpollution-${TAG}-aarch64-apple-darwin.tar.gz" | awk '{print $1}')
          intel_sha=$(shasum -a 256 "dist/hkpollution-${TAG}-x86_64-apple-darwin.tar.gz" | awk '{print $1}')
          mkdir -p tap/Formula
          cat > tap/Formula/hkpollution.rb <<RUBY
          class Hkpollution < Formula
            desc "Hong Kong air quality (AQHI) and weather from official open data"
            homepage "https://github.com/${{ github.repository }}"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/hkpollution-${TAG}-aarch64-apple-darwin.tar.gz"
                sha256 "${arm_sha}"
              end
              on_intel do
                url "${base}/hkpollution-${TAG}-x86_64-apple-darwin.tar.gz"
                sha256 "${intel_sha}"
              end
            end

            def install
              bin.install "hkpollution"
            end

            test do
              assert_match "hkpollution #{version}", shell_output("#{bin}/hkpollution --version")
            end
          end
          RUBY

      - name: Push to the tap
        if: env.BREW_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.BREW_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh repo view hongkong-ai-labs/homebrew-tap >/dev/null 2>&1; then
            echo "hongkong-ai-labs/homebrew-tap does not exist; skipping" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git clone "https://x-access-token:${GH_TOKEN}@github.com/hongkong-ai-labs/homebrew-tap.git" tap-repo
          mkdir -p tap-repo/Formula
          cp tap/Formula/hkpollution.rb tap-repo/Formula/hkpollution.rb
          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/hkpollution.rb
          if git diff --cached --quiet; then
            echo "formula unchanged" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "hkpollution ${VERSION}"
          git push origin HEAD:main
